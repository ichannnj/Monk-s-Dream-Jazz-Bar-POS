services:
  - type: web
    name: monks-dream-pos
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false

    # Environment variables needed for Expo Web compilation
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false

    # SPA Routing: Fallback all navigation routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Optimized CDN Caching headers
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
