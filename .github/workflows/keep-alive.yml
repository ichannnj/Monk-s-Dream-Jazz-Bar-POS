name: Database Keep-Alive (Anti-Sleeping)

on:
  schedule:
    # Runs every 5 minutes (* / 5 * * *)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Supabase Health Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qlflnuvqsqwbfzyziwoz.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_r3pJ1Jy4THvii8N7rByZhQ_MNWDY4jf' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/venue_settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "User-Agent: GitHub-Actions-KeepAlive/1.0")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Payload: $BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase database pinged successfully. Database kept warm."
          else
            echo "⚠️ Unexpected response: $HTTP_STATUS"
            exit 1
          fi

