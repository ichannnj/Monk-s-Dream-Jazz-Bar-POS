services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    stop_grace_period: 90s
    shm_size: 512mb
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /mnt/backup/wal:/wal-archive
    secrets: [db_password]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_owner -d pos"]
      interval: 5s
      retries: 30

  api:
    image: ghcr.io/monks-dream/hub-api:1.0.0
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./config:/config:ro
      - /dev/usb:/dev/usb
    device_cgroup_rules: ["c 180:* rmw"]
    group_add:
      - 7 # GID for host 'lp' group for printer access
    secrets: [db_password, jwt_key, hub_supabase_refresh_token]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 10s
      retries: 6

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "443:443"
      - "127.0.0.1:8080:8080" # Loopback only for PC kiosk console
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - ./admin-web:/srv/admin:ro

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_key:
    file: ./secrets/jwt_key
  hub_supabase_refresh_token:
    file: ./secrets/hub_supabase_refresh_token
